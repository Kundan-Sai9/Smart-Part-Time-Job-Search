spring.application.name=SmartJobSearch
server.port=8080

# Database — injected from docker-compose environment
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.springframework=INFO

# JWT
security.jwt.secret=${JWT_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
security.jwt.access-token-ttl-ms=3600000
security.jwt.issuer=smartjobsearch

# Cohere
cohere.api.key=${COHERE_API_KEY}

